name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build
        run: npx vite build
        working-directory: web
      # The app ships the built files, so they must match the source.
      - name: Built files are up to date
        run: git diff --exit-code --stat -- app/src/main/assets/web || (echo "Run 'npx vite build' in web/ and commit the result." && exit 1)
      - name: Size budget
        run: node tools/size-budget.mjs

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: relay

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f relay/Dockerfile -t smartphonex-relay .
      - name: Smoke test
        run: |
          docker run -d --name relay -p 127.0.0.1:8787:8787 smartphonex-relay
          for i in $(seq 1 20); do curl -sf localhost:8787/health && break; sleep 1; done
          curl -sf -o /dev/null localhost:8787/login
          docker exec relay node admin.mjs list
          test "$(docker exec relay id -un)" = node
