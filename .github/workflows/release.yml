# Builds a signed APK from a version tag and attaches it to a GitHub release.
#   git tag v0.7.0 && git push origin v0.7.0
# Needs repository secrets: SPX_KEYSTORE_BASE64 (the .jks file, base64), SPX_KEYSTORE_PASSWORD, SPX_KEY_ALIAS, SPX_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag matches the app version
        run: |
          v=$(grep '^spx.versionName=' gradle.properties | cut -d= -f2)
          test "v$v" = "$GITHUB_REF_NAME" || (echo "Tag $GITHUB_REF_NAME but gradle.properties says $v" && exit 1)
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SPX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || (echo "SPX_KEYSTORE_BASE64 is not set" && exit 1)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SPX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          SPX_KEYSTORE_PASSWORD: ${{ secrets.SPX_KEYSTORE_PASSWORD }}
          SPX_KEY_ALIAS: ${{ secrets.SPX_KEY_ALIAS }}
          SPX_KEY_PASSWORD: ${{ secrets.SPX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintVitalRelease assembleRelease --console=plain
      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "SmartPhoneX-$GITHUB_REF_NAME.apk"
          sha256sum "SmartPhoneX-$GITHUB_REF_NAME.apk" > "SmartPhoneX-$GITHUB_REF_NAME.apk.sha256"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SmartPhoneX-${{ github.ref_name }}.apk
            SmartPhoneX-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
